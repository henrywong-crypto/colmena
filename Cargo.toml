[package]
name = "colmena"
version = "0.5.0-pre"
authors = ["Zhaofeng Li <hello@zhaofeng.li>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-stream = "0.3.6"
async-trait = "0.1.89"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "wrap_help"] }
clap_complete = "4.5"
clicolors-control = "1"
console = "0.16.2"
const_format = "0.2.35"
futures = "0.3.31"
glob = "0.3.3"
hostname = "0.4.2"
indicatif = "0.18.3"
itertools = "0.14.0"
libc = "0.2.179"
quit = "2.0.0"
rayon = "1.11"
regex = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shell-escape = "0.1.5"
snafu = { version = "0.8.9", features = ["backtrace", "backtraces-impl-backtrace-crate"] }
sys-info = "0.9.1"
tempfile = "3.24.0"
tokio-stream = "0.1.18"
toml = "0.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
uuid = { version = "1.19.0", features = ["serde", "v4"] }
validator = { version = "0.20.0", features = ["derive"] }

[dev-dependencies]
ntest = "0.9.5"
tokio-test = "0.4.5"

[dependencies.tokio]
version = "1.49.0"
features = [
	"fs",
	"io-util",
	"macros",
	"process",
	"rt",
	"rt-multi-thread",
	"sync",
]
